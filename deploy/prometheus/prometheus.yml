global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: itura-production

scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Traefik ingress metrics
  - job_name: traefik
    static_configs:
      - targets: [traefik:8080]

  # Node exporter — system metrics (all Swarm nodes)
  - job_name: node
    dns_sd_configs:
      - names: [tasks.node-exporter]
        type: A
        port: 9100

  # cAdvisor — container metrics (all Swarm nodes)
  - job_name: cadvisor
    dns_sd_configs:
      - names: [tasks.cadvisor]
        type: A
        port: 8080

  # Application services — /metrics endpoint
  - job_name: itura-gateway
    dns_sd_configs:
      - names: [tasks.gateway]
        type: A
        port: 8080
    metrics_path: /metrics

  - job_name: itura-auth
    dns_sd_configs:
      - names: [tasks.auth]
        type: A
        port: 8080
    metrics_path: /metrics


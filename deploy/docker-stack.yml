        Username=itura_notification;Password__File=/run/secrets/itura_db_password;
        SSL Mode=Require;Trust Server Certificate=true
      Jwt__PublicKeyPath: /run/secrets/itura_jwt_public_key
      RabbitMq__Host: ${RABBITMQ_URL}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__PasswordFile: /run/secrets/itura_smtp_password
      Apns__TeamId: ${APNS_TEAM_ID}
      Apns__KeyId: ${APNS_KEY_ID}
      Apns__BundleId: ${APNS_BUNDLE_ID}
      Apns__PrivateKeyFile: /run/secrets/itura_apns_private_key
      Apns__Sandbox: "false"
      Firebase__CredentialsFile: /run/secrets/itura_firebase_credentials
    secrets:
      - itura_jwt_public_key
      - itura_db_password
      - itura_smtp_password
      - itura_apns_private_key
      - itura_firebase_credentials
    networks:

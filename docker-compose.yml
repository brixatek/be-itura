version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: itura-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: itura_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itura-net

  redis:
    image: redis:7-alpine
    container_name: itura-redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itura-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: itura-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: itura
      RABBITMQ_DEFAULT_PASS: itura_pass
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - itura-net

  auth-api:
    build:
      context: .
      dockerfile: src/Services/Auth/Itura.Auth.API/Dockerfile
    container_name: itura-auth-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=itura_auth;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itura-net
    restart: unless-stopped

networks:
  itura-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

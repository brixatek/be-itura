# Full-stack local environment — all 17 services containerized
# Usage: docker compose -f docker-compose.yml -f docker-compose.services.yml up --build
# Single service: docker compose -f docker-compose.yml -f docker-compose.services.yml up --build auth

# Reusable build + env defaults (merged with <<: [*base, *deps] below)
x-base: &base
  restart: unless-stopped
  networks:
    - itura-net
  environment:
    ASPNETCORE_ENVIRONMENT: Development

x-deps: &deps
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:

  gateway:
    <<: *base
    container_name: itura-gateway
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__AllowedOrigins: "http://localhost:3000"
    depends_on:
      - auth
      - user
      - ai
      - mood
      - journal
      - community
      - coach
      - booking
      - payment
      - notification

  auth:
    <<: [*base, *deps]
    container_name: itura-auth
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_DIR: Auth
        SERVICE_NAME: Auth
        ASSEMBLY: Itura.Auth.API.dll
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=itura_auth;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMQ: rabbitmq

  user:

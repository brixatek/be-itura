[build]
builder = "dockerfile"

# ── Gateway ──────────────────────────────────────────────────────────────────
[[services]]
name = "gateway"
dockerfile = "deploy/Dockerfile.gateway"
buildContext = "."

[services.deploy]
startCommand = "dotnet Itura.Gateway.dll"
healthcheckPath = "/health"
healthcheckTimeout = 30

# ── Auth ─────────────────────────────────────────────────────────────────────
[[services]]
name = "auth"
dockerfile = "deploy/Dockerfile"
buildContext = "."

[services.build.args]
SERVICE_DIR = "Auth"
SERVICE_NAME = "Auth"
ASSEMBLY = "Itura.Auth.API.dll"

[services.deploy]
startCommand = "dotnet Itura.Auth.API.dll"
healthcheckPath = "/health"
healthcheckTimeout = 30

